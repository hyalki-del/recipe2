name: Extract Materials and Units

on:
  push:
    paths:
      - 'rec.json'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Botun repository'ye dosya yazabilmesi için ŞARTTIR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Extraction Script
        run: |
          # Önce rec.json'u rec.csv'ye çeviren Python kodunuz
          python3 -c '
          import json, csv
          with open("rec.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if isinstance(data, dict): data = [data]
          if data:
              with open("rec.csv", "w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=data[0].keys())
                  writer.writeheader()
                  writer.writerows(data)
          '
          
          # Şimdi malzeme ve birimleri özetleyen Python kodunu çalıştıralım
          python3 extract_materials.py

      - name: Commit and push generated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add malzeme_birim_ozet.csv rec.csv
          git commit -m "Auto-generate malzeme_birim_ozet.csv via GitHub Actions" || exit 0
          git push
