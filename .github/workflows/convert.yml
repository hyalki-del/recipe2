name: Malzeme Listesi Guncelle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          pip install pandas openpyxl

      - name: Python Scriptini Calistir
        run: |
          python extract_materials.py

      - name: Degisiklikleri Kaydet ve GitHub'a Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add .
          git commit -m "Otomatik guncellendi: extract_materials.py calistirildi" || echo "Degisiklik yok"
          git push origin main
