name: Arda'nın Mutfağı Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub deponuzda değişiklik yapabilmek (commit) için yetki veriyoruz
    steps:
      - name: Kodları depodan al
        uses: actions/checkout@v4

      - name: Python ortamını kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli kütüphaneleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scraper betiğini çalıştır
        run: python scraper.py

      - name: Değişiklikleri GitHub'a kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tarif.json
          git commit -m "Otomatik tarif JSON dosyası güncellendi" || echo "Değişiklik yok"
          git push
