name: Malzeme Listesi Guncelle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
  # Omit or structure standard ubuntu runner for Python execution
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          pip install pandas openpyxl

      - name: Python Scriptini Calistir
        run: |
          python malzeme_listesi_olustur.py

      - name: Degisiklikleri Kaydet ve GitHub'a Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sadece_benzersiz_malzemeler.csv
          git commit -m "Otomatik guncellendi: Benzersiz malzeme listesi" || echo "Degisiklik yok"
          git push
