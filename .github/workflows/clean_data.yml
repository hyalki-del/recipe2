name: Malzeme Temizleme ve Ayırma

on:
  push:
    branches:
      - main
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python Scriptini Çalıştır
        run: |
          python analiz.py

      - name: tm_ay.csv Dosyasını Git'e Ekle ve Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tm_ay.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik güncelleme: tm_ay.csv oluşturuldu ve güncellendi" && git push)
