name: Yemek Tarifleri Ayrıştırıcı

# Hangi durumlarda çalışacağını belirler
on:
  push:
    branches: [ "main", "master" ] # main veya master dalına push yapıldığında
  workflow_dispatch: # GitHub arayüzünden manuel olarak tetikleme

permissions:
  contents: write # Üretilen/düzenlenen CSV dosyasını repoya geri commit'leyebilmek için yazma izni

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repodaki dosyaları GitHub runner ortamına kopyala
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    # 2. Python ortamını kur
    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Gerekli kütüphaneleri yükle (Pandas vb.)
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    # 4. Python scriptini çalıştır
    - name: Python Scriptini Çalıştır
      run: |
        python script.py

    # 5. tm.csv dosyasını kaydet, senkronize et ve push yap
    - name: Çıktı Dosyasını Kaydet ve Push Yap
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        
        # Değişiklikleri git'e ekle ve stash'le (unstaged changes hatasını önlemek için)
        git add tm.csv
        git stash
        git pull origin main --rebase
        git stash pop || true
        
        # Güncellenen tm.csv dosyasını commit'le ve push'la
        git add tm.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Tekrarlayan satirlar temizlendi [skip ci]" && git push origin main)
