name: Ardanın Mutfağı Scraper

on:
  workflow_dispatch: # GitHub arayüzünden manuel tetiklemek için
  schedule:
    - cron: '0 0 * * 0' # Her Pazar gece yarısı otomatik çalışır (isteğe bağlı)

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rec.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update rec.json automatically"
          git push
