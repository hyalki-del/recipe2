name: Convert JSON and Extract Ingredients

on:
  push:
    paths:
      - 'rec.json'
  workflow_dispatch:

jobs:
  process-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run JSON to CSV and Ingredient Extractor
        run: |
          python3 -c '
          import json, csv
          with open("rec.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if isinstance(data, dict): data = [data]
          if data:
              with open("rec.csv", "w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=data[0].keys())
                  writer.writeheader()
                  writer.writerows(data)
          '
          python3 parse_ingredients.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rec.csv sadece_malzemeler.csv
          git commit -m "Auto-update rec.csv and sadece_malzemeler.csv" || exit 0
          git push
