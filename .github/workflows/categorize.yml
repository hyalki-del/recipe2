name: Yemek Tarifleri Ayrıştırıcı

# Hangi durumlarda çalışacağını belirler
on:
  push:
    branches: [ "main", "master" ] # main veya master dalına push yapıldığında
  workflow_dispatch: # GitHub arayüzünden manuel olarak "Run workflow" butonuna basıldığında da çalışır

permissions:
  contents: write # Üretilen CSV dosyasını repoya geri commit'leyebilmek için yazma izni

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repodaki dosyaları GitHub runner ortamına kopyala
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    # 2. Python ortamını kur
    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Kullanmak istediğiniz Python sürümü

    # 3. Gerekli kütüphaneleri yükle (Pandas vb.)
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    # 4. Sizin Python scriptinizi çalıştır
    - name: Python Scriptini Çalıştır
      run: |
        python script.py # Burada python dosyanızın adını kendi dosya adınızla değiştirebilirsiniz

    # 5. Temizlenen dosyayı git'e ekle ve repoya commit'le
    - name: Çıktı Dosyasını Kaydet ve Push Yap
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add temizlenmis_malzemeler.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik malzeme ayrıştırma çıktısı eklendi [skip ci]" && git push)
