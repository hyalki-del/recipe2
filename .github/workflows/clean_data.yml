name: Malzeme Temizleme Otomasyonu

on:
  push:
    branches:
      - main
  workflow_dispatch: # GitHub Actions sekmesinden manuel tetiklemek için

jobs:
  clean-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle (Gerekirse)
        run: |
          python -m pip install --upgrade pip

      - name: Python Temizleme Scriptini Çalıştır
        run: |
          python analiz.py

      - name: Temizlenmiş Dosyayı Git ile Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temizlenmiş_malzemeler.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik veri temizleme: temizlenmiş_malzemeler.csv güncellendi" && git push)
